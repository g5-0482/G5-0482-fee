<!DOCTYPE html>
<html>
<head>
    <title>Four Boxes at Center</title>
    <style>
        body {
            margin: 0;
            background-color: #333;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 80%;
            height: 500px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .row {
            display: flex;
            gap: 25px;
        }

        .box {
            width: 180px;
            height: 100px;
            background-color: #1e90ff;
            border-radius: 15px;
        }

        h2 {
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box-container">
            <div class="box"></div>
            <div class="row">
                <div class="box"></div>
                <div class="box"></div>
            </div>
            <div class="box"></div>
        </div>
    </div>
</body>
</html>
